<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulários</title>
</head>
<body>
    <h1>Mais itens de Form</h1>
    <form action="cadastro.php" method="get" autocomplete="on">

        <fieldset>
            <legend>Esportes Favoritos</legend>
            <p>
                <input type="checkbox" name="fut" id="ifut" checked>
                <label for="ifut">Futebol</label><br>
                <input type="checkbox" name="bas" id="ibas">
                <label for="ibas">Basquete</label> <br>
                <input type="checkbox" name="vol" id="ivol" checked>
                <label for="ivol">Vôlei</label><br>
                <input type="checkbox" name="inat" id="inat">
                <label for="inat">Natação</label><br>
                <input type="checkbox" name="ten" id="iten">
                <label for="iten">Tênis</label>
            </p>
        </fieldset>


        <fieldset>
            <legend>Sexo</legend>
            <input type="radio" name="sexo" id="imas">
            <label for="imas">Masculino</label> <br>
            <input type="radio" name="sexo" id="ifem" checked>
            <label for="ifem">Feminino</label>
        </fieldset>



        <p>
            <input type="submit" value="Enviar">
            <input type="reset" value="Limpar">
        </p>
    </form>
</body>
</html>
